name: calendar-manager

services:
  db:
    image: postgres:18-alpine
    container_name: calendar-manager-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - internal

  server:
    container_name: calendar-manager-server
    build: .
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    environment:
      LOG_LEVEL: ${LOG_LEVEL:?}
      BASE_URL: ${BASE_URL:?}
      SESSION_SECRET: ${SESSION_SECRET:?}

      GITHUB_CLIENT_ID: $GITHUB_CLIENT_ID
      GITHUB_CLIENT_SECRET: $GITHUB_CLIENT_SECRET

      GOOGLE_CLIENT_ID: $GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET: $GOOGLE_CLIENT_SECRET

      POCKETID_CLIENT_ID: $POCKETID_CLIENT_ID
      POCKETID_CLIENT_SECRET: $POCKETID_CLIENT_SECRET
      POCKETID_SERVER_METADATA_URL: $POCKETID_SERVER_METADATA_URL

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      REFRESH_INTERVAL_SECONDS: 300

    volumes:
      - ./src:/app/src

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - internal

volumes:
  postgres-data:

networks:
  internal:
    name: calendar-manager-internal
